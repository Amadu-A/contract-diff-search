# pyproject.toml
# Зависимости модульного монолита и общие проверки Python.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "contract-diff-search"
version = "0.1.0"
description = "Сравнение редакций DOC, DOCX и PDF с OCR и контролем покрытия"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1", "jinja2>=3.1.6,<4", "pypdf>=6,<7",
  "pypdfium2>=4.30,<6", "pdfplumber>=0.11,<1", "pillow>=13,<14",
  "numpy>=2,<3", "scipy>=1.14,<2", "lxml>=5.3,<7", "celery>=5.4,<6",
  "httpx>=0.28,<1", "reportlab>=5,<6",
  "olefile>=0.47,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "playwright>=1.50,<2"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: реальные адаптеры PDF, OCR и LibreOffice",
  "real: локальные конфиденциальные договоры из examples",
  "external: доступ к общему RabbitMQ или VLM",
  "browser: проверки интерфейса в изолированном браузере Playwright",
]
addopts = "-ra -p no:cacheprovider"
